name: Build and Deploy Documentation

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Fetch full history for proper versioning
    
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install -e .
    
    - name: Build documentation
      env:
        GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
        GOOGLE_ANALYTICS_KEY: ${{ vars.GOOGLE_ANALYTICS_KEY }}
      run: |
        cd docs
        make clean
        make html SPHINXOPTS="-n -W --keep-going"

    - name: Validate search discovery files
      run: python paper/scripts/check_discovery.py docs/_build/html
    
    - name: Check documentation build
      run: |
        cd docs/_build/html
        python -c "
        import os
        files = os.listdir('.')
        print('Built files:', files)
        assert 'index.html' in files, 'index.html not found'
        assert 'api.html' in files, 'api.html not found'
        assert 'strategies.html' in files, 'strategies.html not found'
        assert 'standalone-screening.html' in files, 'standalone screening guide not found'
        assert 'architecture.html' in files, 'architecture guide not found'
        print('Documentation build successful!')
        "
    
    - name: Upload documentation artifact
      if: github.ref == 'refs/heads/main' || github.event_name == 'release'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ./docs/_build/html
    
  docs-deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    needs: docs-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One Pages deployment at a time, and never cancel one mid-flight.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
