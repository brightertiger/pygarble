name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Never cancel a release that is already publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          # ubuntu-latest moves to 26.04, which has no setup-python 3.8 build.
          # Return to ubuntu-latest once Python 3.8 is dropped.
          - python-version: '3.8'
            os: ubuntu-24.04
          - python-version: '3.12'
            os: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        if: matrix.python-version == '3.12'
        run: make lint

      - name: Run tests
        run: pytest -q

      - name: Golden corpora reproduce
        if: matrix.python-version == '3.12'
        run: |
          python paper/regression/golden.py --check
          python paper/regression/golden_scan.py --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(PYTHONPATH=. python -c "import pygarble; print(pygarble.__version__)")
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pygarble.__version__ $version" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke-test the built wheel in a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -c "import pygarble; from pygarble import EnsembleDetector; assert EnsembleDetector().predict('qxzjkwpv bnmqwer'); print('pygarble', pygarble.__version__, 'wheel OK')"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    # Recommended: give the `pypi` environment required reviewers in the
    # repository settings so a tag cannot publish without approval. It is
    # auto-created without protection on first use.
    environment:
      name: pypi
      url: https://pypi.org/project/pygarble/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Runs only after the release tests pass and the distributions build.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
