name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # ubuntu-latest moves to 26.04, which has no setup-python 3.8/3.9 builds.
    # Return to ubuntu-latest once Python 3.8 and 3.9 are dropped.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,docs]"

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short --cov=pygarble --cov-report=xml

    - name: Run installed console scripts
      if: matrix.python-version == '3.12'
      run: |
        pygarble --help
        pygarble check -t "hello world"
        pygarble-screen --help

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: ./coverage.xml
        disable_search: true
        flags: unittests
        name: codecov-umbrella
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
    - name: Install numpy
      run: python -m pip install numpy==2.5.4
    - name: Recompute the preprint metrics from the saved predictions
      run: make benchmark-verify

  screening-backends:
    # ubuntu-latest moves to 26.04, which has no setup-python 3.8 build.
    # Return to ubuntu-latest once Python 3.8 is dropped.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ['3.8', '3.12', '3.13']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml
    - run: pip install -e ".[screening]" pytest
    - name: Install pinned Gitleaks executable
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        mkdir -p "$RUNNER_TEMP/pygarble-gitleaks"
        cd "$RUNNER_TEMP/pygarble-gitleaks"
        curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
        echo "$RUNNER_TEMP/pygarble-gitleaks" >> "$GITHUB_PATH"
    - name: Exercise optional backends without Python network access
      run: |
        gitleaks version
        pytest tests/test_screening*.py -v --tb=short

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORDLIST: ${{ github.workspace }}/.wordlist/count_1w.txt
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: pyproject.toml
    - run: pip install -e ".[dev]"
    - run: black --check pygarble tests paper/scripts paper/regression docs/_ext
    - run: isort --check-only pygarble tests paper/scripts paper/regression docs/_ext
    - run: flake8 pygarble tests paper/scripts paper/regression docs/_ext
    - run: mypy pygarble
    - run: python paper/scripts/update_strategy_docs.py --check
    - name: Read the pinned word-list source
      id: wordlist
      run: |
        python - >> "$GITHUB_OUTPUT" <<'PY'
        import json
        curation = json.load(open("paper/scripts/data_curation.json"))
        print("url=" + curation["source_url"])
        print("sha256=" + curation["source_sha256"])
        PY
    - name: Restore the pinned word list
      id: wordlist-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .wordlist/count_1w.txt
        key: norvig-count_1w-${{ steps.wordlist.outputs.sha256 }}
    - name: Download the pinned word list
      if: steps.wordlist-cache.outputs.cache-hit != 'true'
      env:
        URL: ${{ steps.wordlist.outputs.url }}
        SHA256: ${{ steps.wordlist.outputs.sha256 }}
      run: |
        mkdir -p "$(dirname "$WORDLIST")"
        curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 -o "$WORDLIST" "$URL"
        echo "$SHA256  $WORDLIST" | sha256sum --check
    - name: Verify generated data
      run: python paper/scripts/generate_data.py --check --source "$WORDLIST"
    - name: Golden corpus reproduces
      run: python paper/regression/golden.py --check
    - name: Golden scan corpus
      run: python paper/regression/golden_scan.py --check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, quality, screening-backends, benchmark]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*
    - name: Check installed wheel without runtime dependencies
      run: |
        python -m venv /tmp/pygarble-wheel
        /tmp/pygarble-wheel/bin/pip install --no-deps dist/*.whl
        cd /tmp
        /tmp/pygarble-wheel/bin/python -c "from pygarble import EnsembleDetector; d = EnsembleDetector(); assert d.predict('नमस्ते दुनिया'); assert not d.predict('Hello world'); assert d.predict('hello\\x00world')"
        /tmp/pygarble-wheel/bin/python -c "from pygarble.screening import Scanner; s = Scanner(); assert s.scan('mail a@b.co').flagged; assert not s.scan('qxzjkwpv bnmqwer').flagged"
        /tmp/pygarble-wheel/bin/python - <<'PY'
        from importlib import import_module
        from pygarble import EnsembleDetector
        from pygarble.gibberish import EnsembleDetector as CanonicalDetector
        from pygarble.gibberish.strategies import _EXPORTS
        assert EnsembleDetector is CanonicalDetector
        for name in set(_EXPORTS.values()):
            assert import_module('pygarble.strategies.' + name) is import_module(
                'pygarble.gibberish.strategies.' + name
            )
        for name in ('pii.patterns', 'profanity.wordlist', 'secrets.patterns'):
            assert import_module('pygarble.' + name) is import_module(
                'pygarble.screening.' + name
            )
        PY
