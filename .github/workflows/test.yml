name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest tests/ -v --tb=short --cov=pygarble --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install -e ".[dev]"
    - run: black --check pygarble tests scripts regression
    - run: isort --check-only pygarble tests scripts regression
    - run: flake8 pygarble tests scripts regression
    - run: mypy pygarble
    - run: python scripts/update_strategy_docs.py --check
    - name: Verify generated data
      run: python scripts/generate_data.py --check
    - name: Golden corpus reproduces
      run: python regression/golden.py --check

  build:
    runs-on: ubuntu-latest
    needs: [test, quality]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*
    - name: Check installed wheel without runtime dependencies
      run: |
        python -m venv /tmp/pygarble-wheel
        /tmp/pygarble-wheel/bin/pip install --no-deps dist/*.whl
        cd /tmp
        /tmp/pygarble-wheel/bin/python -c "from pygarble import EnsembleDetector; d = EnsembleDetector(); assert d.predict('नमस्ते दुनिया'); assert not d.predict('Hello world'); assert d.predict('hello\\x00world')"

