[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pygarble"
dynamic = ["version"]
description = "Deterministic, zero-dependency text screening: secrets, PII, profanity and gibberish, with redaction"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ujjwal Singh Rao", email = "ujjwalsrao@gmail.com"},
]
keywords = ["garble", "text", "detection", "nlp", "english", "gibberish", "text-validation", "pii", "secrets", "profanity", "redaction", "guardrails", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
phones = ["phonenumberslite>=8.13,<10"]
stdnum = ["python-stdnum>=1.20,<3"]
secrets = ["detect-secrets>=1.5,<2"]
screening = [
    "phonenumberslite>=8.13,<10",
    "python-stdnum>=1.20,<3",
    "detect-secrets>=1.5,<2",
]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black==24.8.0",
    "flake8>=3.8",
    "isort>=5.0",
    "pre-commit>=2.0",
    "mypy==1.11.2",
    "build>=1.0",
    "twine>=4.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[project.urls]
Homepage = "https://github.com/brightertiger/pygarble"
Repository = "https://github.com/brightertiger/pygarble"
Issues = "https://github.com/brightertiger/pygarble/issues"
Documentation = "https://brightertiger.github.io/pygarble/"
Changelog = "https://github.com/brightertiger/pygarble/blob/main/CHANGELOG.md"
Contributing = "https://github.com/brightertiger/pygarble/blob/main/CONTRIBUTING.md"
Security = "https://github.com/brightertiger/pygarble/blob/main/SECURITY.md"

[project.scripts]
pygarble = "pygarble.cli:main"
pygarble-screen = "pygarble.screening.cli:main"

[tool.setuptools.packages.find]
include = ["pygarble*"]

[tool.setuptools.package-data]
pygarble = ["data/manifest.json", "py.typed"]

# JSON table copies are for ports; the sdist carries them, wheels do not.
[tool.setuptools.exclude-package-data]
"pygarble.data" = ["words.json", "bigrams.json", "trigrams.json", "secrets.json", "pii.json", "profanity.json"]

[tool.setuptools.dynamic]
version = {attr = "pygarble.__version__"}

[tool.black]
line-length = 79
target-version = ['py38']
force-exclude = '/pygarble/data/(words|bigrams|trigrams)\.py$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.isort]
profile = "black"
line_length = 79

skip_glob = ["pygarble/data/words.py", "pygarble/data/bigrams.py", "pygarble/data/trigrams.py"]
